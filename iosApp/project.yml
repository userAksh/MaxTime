name: iosApp
options:
  bundleIdPrefix: com.maxtime
  deploymentTarget:
    iOS: "15.0"
  generateEmptyDirectories: true

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxtime.ios
        PRODUCT_NAME: iosApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-130636243911-ios-d067622960adf8cc782fe2
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
