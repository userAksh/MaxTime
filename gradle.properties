org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Disabled: Kotlin/Native's CocoaPods podBuild<Pod>IosSimulator tasks each shell out to a
# nested xcodebuild against the same synthetic Xcode project (shared/build/cocoapods/synthetic/ios).
# Running them in parallel risks two xcodebuild processes locking the same build database at
# once ("database is locked" / corrupted build state) — keep this off even if it costs some
# build speed elsewhere.
org.gradle.parallel=false
kotlin.code.style=official
android.useAndroidX=true
kotlin.mpp.stability.nowarn=true
kotlin.native.disableCompilerDaemon=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
